services:
  - type: web
    name: lastlap
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix frontend install && npm --prefix backend install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true